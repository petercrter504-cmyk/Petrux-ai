<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petrux AI</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  height: 100%;
}

body {
  background: #212121;
  color: #ececec;
  font-family: Arial, sans-serif;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  height: 60px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid #363636;
  background: #171717;
}

.logo {
  font-size: 19px;
  font-weight: bold;
}

.logo span {
  color: #10a37f;
}

.status {
  margin-left: auto;
  font-size: 13px;
  color: #aaa;
}

.status.online {
  color: #10a37f;
}

main {
  flex: 1;
  overflow-y: auto;
  padding: 25px 15px 130px;
}

.welcome {
  text-align: center;
  margin: 100px auto 30px;
}

.welcome h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

.welcome p {
  color: #aaa;
}

.messages {
  max-width: 800px;
  margin: 0 auto;
}

.message {
  display: flex;
  margin: 20px 0;
}

.message.user {
  justify-content: flex-end;
}

.bubble {
  max-width: 80%;
  padding: 13px 17px;
  border-radius: 18px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
}

.user .bubble {
  background: #303030;
}

.assistant .bubble {
  background: transparent;
  padding-left: 0;
}

.composer-area {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 15px;
  background: linear-gradient(
    transparent,
    #212121 25%
  );
}

.composer {
  max-width: 800px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 10px;
  background: #303030;
  border: 1px solid #444;
  border-radius: 22px;
}

textarea {
  flex: 1;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  padding: 8px;
  min-height: 42px;
  max-height: 160px;
  font-size: 16px;
}

textarea::placeholder {
  color: #999;
}

button {
  border: 0;
  cursor: pointer;
}

.send {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #f1f1f1;
  color: #171717;
  font-size: 20px;
  font-weight: bold;
}

.send:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.note {
  text-align: center;
  color: #777;
  font-size: 11px;
  margin-top: 8px;
}

@media (max-width: 600px) {
  .welcome {
    margin-top: 70px;
  }

  .welcome h1 {
    font-size: 27px;
  }

  .bubble {
    max-width: 90%;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">
Petrux <span>AI</span>
</div>

<div class="status" id="status">
Connecting...
</div>
</header>

<main id="chatArea">

<div class="welcome" id="welcome">
<h1>What can I help with?</h1>
<p>
Ask Petrux anything. Get help with writing,
ideas, learning, business and more.
</p>
</div>

<div class="messages" id="messages"></div>

</main>

<div class="composer-area">

<div class="composer">

<textarea
id="question"
rows="1"
placeholder="Message Petrux AI..."
></textarea>

<button
class="send"
id="sendButton"
onclick="sendMessage()"
>
↑
</button>

</div>

<div class="note">
Petrux AI can make mistakes. Check important information.
</div>

</div>

</div>

<script>
const question =
  document.getElementById('question');

const messages =
  document.getElementById('messages');

const welcome =
  document.getElementById('welcome');

const sendButton =
  document.getElementById('sendButton');

const status =
  document.getElementById('status');

const chatArea =
  document.getElementById('chatArea');

let history = [];
let busy = false;

function addMessage(role, text) {
  welcome.style.display = 'none';

  const row =
    document.createElement('div');

  row.className =
    'message ' + role;

  const bubble =
    document.createElement('div');

  bubble.className = 'bubble';
  bubble.textContent = text;

  row.appendChild(bubble);

  messages.appendChild(row);

  chatArea.scrollTop =
    chatArea.scrollHeight;

  return bubble;
}

async function sendMessage() {
  const text =
    question.value.trim();

  if (!text || busy) {
    return;
  }

  busy = true;

  sendButton.disabled = true;

  question.value = '';
  question.style.height = 'auto';

  history.push({
    role: 'user',
    content: text
  });

  addMessage('user', text);

  const answerBubble =
    addMessage(
      'assistant',
      'Thinking...'
    );

  try {
    const response = await fetch(
      '/api/chat',
      {
        method: 'POST',
        headers: {
          'Content-Type':
            'application/json'
        },
        body: JSON.stringify({
          messages: history
        })
      }
    );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        'Could not get a response.'
      );
    }

    const answer =
      data.answer ||
      'Sorry, no answer was returned.';

    answerBubble.textContent = answer;

    history.push({
      role: 'assistant',
      content: answer
    });

  } catch (error) {
    console.error(error);

    answerBubble.textContent =
      'Sorry, there was a problem: ' +
      error.message;
  } finally {
    busy = false;

    sendButton.disabled = false;

    question.focus();
  }
}

question.addEventListener(
  'keydown',
  function (event) {
    if (
      event.key === 'Enter' &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }
  }
);

question.addEventListener(
  'input',
  function () {
    this.style.height = 'auto';

    this.style.height =
      Math.min(
        this.scrollHeight,
        160
      ) + 'px';
  }
);

async function checkStatus() {
  try {
    const response =
      await fetch('/api/status');

    const data =
      await response.json();

    if (data.online) {
      status.textContent =
        '● Online';

      status.classList.add('online');
    }
  } catch (error) {
    status.textContent =
      '● Offline';
  }
}

checkStatus();
</script>

</body>
</html>
