<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petrux AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#1a0b2e;color:#fff;min-height:100vh;padding:15px}
.header{text-align:center;margin-bottom:15px}
.header h1{font-size:32px}
.header p{color:#c084fc;margin-top:5px}
.pro-box{text-align:center;margin:0 0 15px;background:#2a1445;border:1px solid #ffcc00;border-radius:18px;padding:14px}
.pro-btn{display:inline-block;background:#ffcc00;color:#000;padding:13px 24px;border-radius:25px;font-weight:bold;text-decoration:none;font-size:16px}
.pro-box p{color:#c084fc;font-size:13px;margin-top:8px}
.pro-badge{display:inline-block;background:#22c55e;color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:bold;margin-top:8px}
.card{background:#2a1445;border-radius:20px;padding:15px;margin-bottom:15px}
textarea,input{width:100%;padding:12px;border-radius:12px;border:none;outline:none;font-size:16px;background:#fff;color:#000;margin-bottom:10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:10px 14px;border-radius:20px;border:1px solid #fff;background:transparent;color:#fff;cursor:pointer;font-size:14px}
.tab.active{background:#fff;color:#000;font-weight:bold}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:bold;cursor:pointer;margin-bottom:10px}
.btn-purple{background:#a855f7;color:#fff}
.btn-pink{background:#ec4899;color:#fff}
.btn-orange{background:#f59e0b;color:#000}
.btn-dark{background:#222;color:#fff}
#replyBox{background:#000;border-radius:15px;padding:15px;min-height:120px;white-space:pre-wrap;line-height:1.6;font-size:16px;margin-top:10px;word-break:break-word}
#replyBox img{width:100%;border-radius:12px;margin-top:10px}
#gallery img{width:100%;border-radius:12px;margin-bottom:10px}
small{color:#aaa}
label{font-size:14px;color:#c084fc;display:block;margin-bottom:5px}
</style>
</head>
<body>

<div class="header">
<h1>✨ Petrux AI</h1>
<p>Created by Peter Oriorowho</p>
</div>

<div class="pro-box" id="proBox">
<a href="https://paystack.shop/pay/3xcrhonpjp" class="pro-btn">⭐ Go Pro - ₦5,000</a>
<p>Unlock unlimited music, images, clone & edit • No daily limit</p>
<div id="proStatus"></div>
<p style="color:#aaa;font-size:12px;margin-top:6px;" id="usageText"></p>
</div>

<div class="card">
<div class="tabs">
<button class="tab active" id="tabAsk" onclick="setMode('ask')">💬 Ask</button>
<button class="tab" id="tabMusic" onclick="setMode('music')">🎵 Music</button>
<button class="tab" id="tabImage" onclick="setMode('image')">🖼️ Image</button>
<button class="tab" id="tabClone" onclick="setMode('clone')">👯 Clone</button>
<button class="tab" id="tabEdit" onclick="setMode('edit')">✏️ Edit</button>
<button class="tab" onclick="showGallery()">🖼️ Gallery</button>
</div>

<textarea id="prompt" rows="3" placeholder="Ask Petrux anything... e.g. Give me best reply to this girl, Write song about Lagos..."></textarea>

<div id="uploadBox" style="display:none;">
<label>📸 Upload Image (for Clone / Edit):</label>
<input type="file" id="imageFile" accept="image/*" onchange="previewImage(event)">
<img id="preview" style="width:100%;border-radius:12px;display:none;margin-bottom:10px;">
</div>

<button class="btn btn-purple" onclick="send()">Ask Petrux AI →</button>
<button class="btn btn-pink" onclick="talk()">🎙️ Talk to Petrux - Tap & Speak</button>
<button id="voiceToggle" class="btn btn-dark" onclick="toggleVoice()">🔇 Voice: OFF - Tap to Turn ON</button>
<button class="btn btn-orange" onclick="hearSpeak()">🔊 Hear Petrux Speak</button>

<div id="replyBox">Ask me anything, I am here for you...</div>
<p style="margin-top:8px;"><small id="status"></small></p>
<div id="gallery" style="margin-top:15px;"></div>
</div>

<script>
let mode = 'ask';
let voiceOn = localStorage.getItem('petruxVoice') === 'on' ? true : false;
let lastReply = '';
let uploadedImage = '';

// --- PRO / FREE LIMIT ---
let isPro = localStorage.getItem('petruxPro') === 'yes';
let FREE_LIMIT = 5;
function getUsage(){
  let today = new Date().toDateString();
  let saved = JSON.parse(localStorage.getItem('petruxUsage') || '{"date":"","count":0}');
  if(saved.date !== today){ saved = {date: today, count: 0}; }
  return saved;
}
function updateProUI(){
  let u = getUsage();
  let statusEl = document.getElementById('proStatus');
  let usageEl = document.getElementById('usageText');
  if(isPro){
    if(statusEl) statusEl.innerHTML = '<span class="pro-badge">✅ PRO ACTIVE - Unlimited</span>';
    if(usageEl) usageEl.innerText = '';
  } else {
    if(statusEl) statusEl.innerHTML = '';
    if(usageEl) usageEl.innerText = 'Free today: ' + u.count + ' / ' + FREE_LIMIT + ' uses left: ' + (FREE_LIMIT - u.count);
  }
}
function checkLimit(){
  if(isPro) return true;
  let u = getUsage();
  if(u.count >= FREE_LIMIT){
    document.getElementById('replyBox').innerText = '🔒 You don use your 5 free uses for today!\n\nGo Pro for ₦5,000 to unlock unlimited music, images, clone & edit.';
    alert('You don reach free limit for today. Tap Go Pro to continue!');
    return false;
  }
  return true;
}
function addUsage(){
  if(isPro) return;
  let u = getUsage();
  u.count++;
  localStorage.setItem('petruxUsage', JSON.stringify(u));
  updateProUI();
}
if(window.location.search.includes('pro=yes')){
  localStorage.setItem('petruxPro','yes');
  isPro = true;
  alert('Welcome to Petrux Pro! Unlimited unlocked 🎉');
}
updateProUI();

function setMode(m){
  mode = m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  let map = {ask:'tabAsk', music:'tabMusic', image:'tabImage', clone:'tabClone', edit:'tabEdit'};
  if(map[m]) document.getElementById(map[m]).classList.add('active');
  document.getElementById('uploadBox').style.display = (m==='clone' || m==='edit') ? 'block' : 'none';
  let ph = {
    ask:'Ask Petrux anything... e.g. Give me best reply to this girl...',
    music:'What song do you want? e.g. Love song about Amara...',
    image:'Describe image... e.g. Nigerian superstar on stage...',
    clone:'Describe how you want the cloned image...',
    edit:'Describe edit... e.g. Change background to beach...'
  };
  document.getElementById('prompt').placeholder = ph[m];
}

function previewImage(e){
  let file = e.target.files[0];
  if(!file) return;
  let reader = new FileReader();
  reader.onload = function(){
    uploadedImage = reader.result;
    let p = document.getElementById('preview');
    p.src = uploadedImage; p.style.display='block';
  };
  reader.readAsDataURL(file);
}

function updateVoiceButton(){
  let btn = document.getElementById('voiceToggle');
  if(!btn) return;
  if(voiceOn){
    btn.innerHTML = '🔊 Voice: ON - Tap to Turn OFF';
    btn.style.background = '#22c55e';
  } else {
    btn.innerHTML = '🔇 Voice: OFF - Tap to Turn ON';
    btn.style.background = '#222';
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
  }
  localStorage.setItem('petruxVoice', voiceOn ? 'on' : 'off');
}

function unlockVoice(){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.getVoices();
  let u = new SpeechSynthesisUtterance(' ');
  u.volume = 0;
  window.speechSynthesis.speak(u);
}

function speakText(text){
  if(!voiceOn) return;
  if(!('speechSynthesis' in window)){ alert('Your phone does not support voice.'); return; }
  if(!text) return;
  text = text.replace(/[*#_~`]/g,'').replace(/https?:\/\/\S+/g,' link ').substring(0, 800);
  window.speechSynthesis.cancel();
  window.speechSynthesis.resume();
  let voices = window.speechSynthesis.getVoices();
  let u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 1; u.pitch = 1; u.volume = 1;
  let v = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('en')) || voices[0];
  if(v) u.voice = v;
  u.onerror = function(){ document.getElementById('status').innerText = 'Voice error, try Hear button again.'; };
  window.speechSynthesis.speak(u);
  let timer = setInterval(()=>{
    if(!window.speechSynthesis.speaking){ clearInterval(timer); }
    else { window.speechSynthesis.resume(); }
  }, 3000);
}

function toggleVoice(){
  voiceOn = !voiceOn;
  updateVoiceButton();
  if(voiceOn){
    unlockVoice();
    setTimeout(()=>{ speakText('Voice is now on. I am Petrux, I am here to help you.'); }, 200);
  }
}
function hearSpeak(){
  if(!lastReply){ alert('Ask Petrux something first!'); return; }
  if(!voiceOn){ voiceOn = true; updateVoiceButton(); unlockVoice(); }
  setTimeout(()=>{ speakText(lastReply); }, 200);
}
function talk(){
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){ alert('Your browser does not support voice. Please type.'); return; }
  let Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = new Rec();
  rec.lang = 'en-US';
  document.getElementById('status').innerText = '🎙️ Listening... talk now...';
  rec.start();
  rec.onresult = function(e){
    let text = e.results[0][0].transcript;
    document.getElementById('prompt').value = text;
    document.getElementById('status').innerText = '';
    send();
  };
  rec.onerror = function(){ document.getElementById('status').innerText = 'Voice did not work, please type.'; };
}

async function send(){
  let prompt = document.getElementById('prompt').value.trim();
  if(!prompt){ alert('Type something first!'); return; }

  let low = prompt.toLowerCase();
  if(mode === 'ask' && (low.includes('generate image') || low.includes('create image') || low.includes('draw') || low.includes('make image') || low.includes('create picture') || low.includes('generate picture') || low.includes('generate an image'))){
    mode = 'image';
    setMode('image');
  }
  if(mode === 'ask' && (low.includes('generate music') || low.includes('create song') || low.includes('write song') || low.includes('make song') || low.includes('generate song'))){
    mode = 'music';
    setMode('music');
  }

  if(mode !== 'ask' && !checkLimit()) return;

  let box = document.getElementById('replyBox');
  box.innerText = 'Petrux is thinking... ⏳';
  try{
    let url = '/api/chat';
    let body = {message: prompt};
    if(mode==='music'){ url='/api/music'; body={prompt}; }
    if(mode==='image'){ url='/api/generate-image'; body={prompt}; }
    if(mode==='clone'){ url='/api/clone-image'; body={prompt, image: uploadedImage}; }
    if(mode==='edit'){ url='/api/edit-image'; body={prompt, image: uploadedImage}; }
    let res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    let data = await res.json();
    if(mode !== 'ask') addUsage();
    if(data.image){
      lastReply = data.reply || 'Your image is ready!';
      box.innerHTML = lastReply + '<br><img src="'+data.image+'">';
      saveToGallery(data.image);
      speakText(lastReply);
    } else {
      lastReply = data.reply || data.music || data.error || 'No reply';
      box.innerText = lastReply;
      speakText(lastReply);
    }
  }catch(e){ box.innerText = 'Network error, try again. ' + e.message; }
}

function saveToGallery(url){
  let g = JSON.parse(localStorage.getItem('petruxGallery') || '[]');
  g.unshift(url);
  localStorage.setItem('petruxGallery', JSON.stringify(g));
}
function showGallery(){
  let g = JSON.parse(localStorage.getItem('petruxGallery') || '[]');
  let div = document.getElementById('gallery');
  if(g.length===0){ div.innerHTML = '<p>No image yet. Generate one first!</p>'; return; }
  div.innerHTML = '<h3>My Gallery</h3>' + g.map(u=>'<img src="'+u+'">').join('');
}
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = function(){ window.speechSynthesis.getVoices(); };
  window.speechSynthesis.getVoices();
}
updateVoiceButton();
</script>
</body>
</html>
