<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petrux AI - Created by Peter Oriorowho</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f7f7f8;display:flex;flex-direction:column;height:100vh}
header{background:#fff;padding:14px;text-align:center;border-bottom:1px solid #ddd;position:relative}
header h1{font-size:20px}
header p{font-size:12px;color:#666}
#clearBtn{position:absolute;right:12px;top:14px;background:#ff4444;color:#fff;border:none;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px}
#chat{flex:1;overflow-y:auto;padding:16px;max-width:800px;width:100%;margin:0 auto}
.msg{max-width:85%;padding:12px 14px;border-radius:14px;margin-bottom:12px;line-height:1.6;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.user{background:#10a37f;color:#fff;margin-left:auto}
.ai{background:#fff;border:1px solid #ddd;margin-right:auto}
.ai b{font-weight:700}
.ai h3{margin:10px 0 5px}
.actions{display:flex;gap:8px;margin-top:8px}
.actions button{background:#eee;border:1px solid #ddd;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:12px}
.typing{color:#888;font-style:italic}
#inputBox{display:flex;gap:8px;padding:12px;max-width:800px;width:100%;margin:0 auto;background:#fff}
#input{flex:1;padding:12px;border:1px solid #ddd;border-radius:10px;outline:none;font-size:15px}
#sendBtn{background:#10a37f;color:#fff;border:none;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:bold}
#tabs{display:flex;gap:8px;justify-content:center;padding:8px;background:#fff;border-top:1px solid #eee}
#tabs button{padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#f0f0f0;cursor:pointer}
#tabs button.active{background:#10a37f;color:#fff}
</style>
</head>
<body>
<header>
<h1>🤖 Petrux AI</h1>
<p>Created by Peter Oriorowho • Like ChatGPT</p>
<button id="clearBtn" onclick="clearMemory()">🗑️ Clear Memory</button>
</header>

<div id="tabs">
<button class="active" onclick="setMode('chat',this)">💬 Chat</button>
<button onclick="setMode('music',this)">🎵 Music</button>
<button onclick="setMode('image',this)">🖼️ Image</button>
</div>

<div id="chat"></div>

<div id="inputBox">
<input id="input" placeholder="Ask Petrux anything..." onkeypress="if(event.key==='Enter') sendMsg()" />
<button id="sendBtn" onclick="sendMsg()">Send ➤</button>
</div>

<script>
let history = JSON.parse(localStorage.getItem('petrux_history') || '[]');
let mode = 'chat';
let lastUserMsg = '';

function setMode(m, btn){
  mode = m;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('input').placeholder = m==='chat' ? 'Ask Petrux anything...' : m==='music' ? 'What song do you want? e.g. Love song...' : 'What image do you want? e.g. Beautiful house in Lagos...';
}

function clearMemory(){
  history = [];
  localStorage.removeItem('petrux_history');
  document.getElementById('chat').innerHTML = '';
  addMsg('ai', 'Memory cleared. Hello Peter! How can I help you today?');
}

function formatText(text){
  // Bold **text** -> <b>text</b>
  let t = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
  // ### Heading
  t = t.replace(/^### (.*$)/gm, '<h3>$1</h3>');
  t = t.replace(/^## (.*$)/gm, '<h3>$1</h3>');
  return t;
}

function addMsg(role, text, showActions=false){
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if(role==='ai'){
    div.innerHTML = formatText(text);
    if(showActions){
      const acts = document.createElement('div');
      acts.className = 'actions';
      acts.innerHTML = `<button onclick="copyText(this)">📋 Copy</button> <button onclick="regenerate()">🔄 Regenerate</button>`;
      div.appendChild(acts);
      div.dataset.fullText = text;
    }
  } else {
    div.textContent = text;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function copyText(btn){
  const text = btn.parentElement.parentElement.dataset.fullText || btn.parentElement.parentElement.innerText;
  navigator.clipboard.writeText(text);
  btn.textContent = '✅ Copied!';
  setTimeout(()=>btn.textContent='📋 Copy',1500);
}

async function regenerate(){
  if(!lastUserMsg) return;
  // Remove last AI message
  const msgs = document.querySelectorAll('#chat .msg.ai');
  if(msgs.length) msgs[msgs.length-1].remove();
  await callAI(lastUserMsg, true);
}

async function sendMsg(){
  const input = document.getElementById('input');
  const text = input.value.trim();
  if(!text) return;
  lastUserMsg = text;
  addMsg('user', text);
  input.value = '';
  await callAI(text, false);
}

async function callAI(text, isRegen){
  const typingDiv = addMsg('ai', 'Petrux is typing... ⏳');
  typingDiv.classList.add('typing');

  let url = '/api/chat';
  let body = { message: text, history: history };
  if(mode==='music'){ url='/api/music'; body={ prompt: text }; }
  if(mode==='image'){ url='/api/generate-image'; body={ prompt: text }; }

  try{
    const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    let reply = data.reply || data.music || 'Sorry, something went wrong.';
    if(data.image){
      reply += '\n\n[Image ready below]';
    }
    typingDiv.remove();

    // Typing effect like ChatGPT
    const msgDiv = addMsg('ai', '', true);
    msgDiv.dataset.fullText = reply;
    let i = 0;
    const interval = setInterval(()=>{
      i += 8; // speed
      const partial = reply.slice(0, i);
      msgDiv.innerHTML = formatText(partial);
      // keep actions at bottom
      const acts = msgDiv.querySelector('.actions');
      if(acts) msgDiv.appendChild(acts);
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
      if(i >= reply.length){
        clearInterval(interval);
        msgDiv.innerHTML = formatText(reply);
        const acts2 = document.createElement('div');
        acts2.className='actions';
        acts2.innerHTML = `<button onclick="copyText(this)">📋 Copy</button> <button onclick="regenerate()">🔄 Regenerate</button>`;
        msgDiv.appendChild(acts2);
      }
    }, 20);

    if(data.image){
      const img = document.createElement('img');
      img.src = data.image;
      img.style.width='100%';
      img.style.borderRadius='12px';
      img.style.marginTop='10px';
      msgDiv.appendChild(img);
    }

    if(mode==='chat'){
      history.push({role:'user', text: text});
      history.push({role:'assistant', text: reply});
      if(history.length > 20) history = history.slice(-20);
      localStorage.setItem('petrux_history', JSON.stringify(history));
    }
  } catch(e){
    typingDiv.textContent = 'Sorry, network error. Try again.';
  }
}

// Welcome message
if(history.length===0){
  addMsg('ai', 'Hello Peter! Great to hear from you, how can I help you today?');
}
</script>
</body>
</html>
