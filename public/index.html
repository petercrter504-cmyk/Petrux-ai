<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petrux AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#1a0b2e;color:#fff;min-height:100vh;padding:15px}
.header{text-align:center;margin-bottom:15px}
.header h1{font-size:32px}
.header p{color:#c084fc;margin-top:5px}
.card{background:#2a1445;border-radius:20px;padding:15px;margin-bottom:15px}
textarea,input{width:100%;padding:12px;border-radius:12px;border:none;outline:none;font-size:16px;background:#fff;color:#000;margin-bottom:10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:10px 14px;border-radius:20px;border:1px solid #fff;background:transparent;color:#fff;cursor:pointer;font-size:14px}
.tab.active{background:#fff;color:#000;font-weight:bold}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:bold;cursor:pointer;margin-bottom:10px}
.btn-purple{background:#a855f7;color:#fff}
.btn-pink{background:#ec4899;color:#fff}
.btn-orange{background:#f59e0b;color:#000}
.btn-dark{background:#222;color:#fff}
.btn-blue{background:#3b82f6;color:#fff}
.btn-green{background:#22c55e;color:#fff}
#replyBox{background:#000;border-radius:15px;padding:15px;min-height:120px;white-space:pre-wrap;line-height:1.6;font-size:16px;margin-top:10px;word-break:break-word}
#replyBox img{width:100%;border-radius:12px;margin-top:10px}
#gallery img{width:100%;border-radius:12px;margin-bottom:10px}
small{color:#aaa}
label{font-size:14px;color:#c084fc;display:block;margin-bottom:5px}
</style>
</head>
<body>

<div class="header">
<h1>✨ Petrux AI</h1>
<p>Created by Peter Oriorowho</p>
</div>

<div class="card">
<div class="tabs">
<button class="tab active" id="tabAsk" onclick="setMode('ask')">💬 Ask</button>
<button class="tab" id="tabMusic" onclick="setMode('music')">🎵 Music</button>
<button class="tab" id="tabImage" onclick="setMode('image')">🖼️ Image</button>
<button class="tab" id="tabClone" onclick="setMode('clone')">👯 Clone</button>
<button class="tab" id="tabEdit" onclick="setMode('edit')">✏️ Edit</button>
<button class="tab" onclick="showGallery()">🖼️ Gallery</button>
</div>

<textarea id="prompt" rows="3" placeholder="Ask Petrux anything... e.g. Give me best reply to this girl, Write song about Lagos..."></textarea>

<div id="uploadBox" style="display:none;">
<label>📸 Upload Image (for Clone / Edit):</label>
<input type="file" id="imageFile" accept="image/*" onchange="previewImage(event)">
<img id="preview" style="width:100%;border-radius:12px;display:none;margin-bottom:10px;">
</div>

<button class="btn btn-purple" onclick="send()">Ask Petrux AI →</button>
<button class="btn btn-pink" onclick="talk()">🎙️ Talk to Petrux - Tap & Speak</button>

<!-- VOICE ON / OFF - DEFAULT OFF -->
<button id="voiceToggle" class="btn btn-dark" onclick="toggleVoice()">🔇 Voice: OFF - Tap to Turn ON</button>
<button class="btn btn-orange" onclick="hearSpeak()">🔊 Hear Petrux Speak</button>

<div id="replyBox">Ask me anything, I dey here for you...</div>
<p style="margin-top:8px;"><small id="status"></small></p>
<div id="gallery" style="margin-top:15px;"></div>
</div>

<script>
let mode = 'ask';
let voiceOn = localStorage.getItem('petruxVoice') === 'on' ? true : false;
let lastReply = '';
let uploadedImage = '';

function setMode(m){
  mode = m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  let map = {ask:'tabAsk', music:'tabMusic', image:'tabImage', clone:'tabClone', edit:'tabEdit'};
  if(map[m]) document.getElementById(map[m]).classList.add('active');
  document.getElementById('uploadBox').style.display = (m==='clone' || m==='edit') ? 'block' : 'none';
  let ph = {
    ask:'Ask Petrux anything... e.g. Give me best reply to this girl...',
    music:'What song you want? e.g. Love song about Amara...',
    image:'Describe image... e.g. Nigerian superstar on stage...',
    clone:'Describe how you want the cloned image...',
    edit:'Describe edit... e.g. Change background to beach...'
  };
  document.getElementById('prompt').placeholder = ph[m];
}

function previewImage(e){
  let file = e.target.files[0];
  if(!file) return;
  let reader = new FileReader();
  reader.onload = function(){
    uploadedImage = reader.result;
    let p = document.getElementById('preview');
    p.src = uploadedImage; p.style.display='block';
  };
  reader.readAsDataURL(file);
}

// === VOICE ON / OFF ===
function updateVoiceButton(){
  let btn = document.getElementById('voiceToggle');
  if(!btn) return;
  if(voiceOn){
    btn.innerHTML = '🔊 Voice: ON - Tap to Turn OFF';
    btn.style.background = '#22c55e';
  } else {
    btn.innerHTML = '🔇 Voice: OFF - Tap to Turn ON';
    btn.style.background = '#222';
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
  }
  localStorage.setItem('petruxVoice', voiceOn ? 'on' : 'off');
}
function toggleVoice(){
  voiceOn = !voiceOn;
  updateVoiceButton();
  if(voiceOn) speakText('Voice don turn on. I be Petrux, I dey here.');
}
function speakText(text){
  if(!voiceOn) return; // If OFF, no talk
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(text);
  u.rate = 1; u.pitch = 1;
  window.speechSynthesis.speak(u);
}
function hearSpeak(){
  if(!lastReply){ alert('Ask Petrux something first!'); return; }
  if(!voiceOn){ voiceOn = true; updateVoiceButton(); }
  speakText(lastReply);
}
function talk(){
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){ alert('Your browser no support voice. Type am.'); return; }
  let Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = new Rec();
  rec.lang = 'en-NG';
  document.getElementById('status').innerText = '🎙️ Listening... talk now...';
  rec.start();
  rec.onresult = function(e){
    let text = e.results[0][0].transcript;
    document.getElementById('prompt').value = text;
    document.getElementById('status').innerText = '';
    send();
  };
  rec.onerror = function(){ document.getElementById('status').innerText = 'Voice no work, type am.'; };
}

async function send(){
  let prompt = document.getElementById('prompt').value.trim();
  if(!prompt){ alert('Type something first!'); return; }
  let box = document.getElementById('replyBox');
  box.innerText = 'Petrux dey think... ⏳';
  try{
    let url = '/api/chat';
    let body = {message: prompt};
    if(mode==='music'){ url='/api/music'; body={prompt}; }
    if(mode==='image'){ url='/api/generate-image'; body={prompt}; }
    if(mode==='clone'){ url='/api/clone-image'; body={prompt, image: uploadedImage}; }
    if(mode==='edit'){ url='/api/edit-image'; body={prompt, image: uploadedImage}; }
    let res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    let data = await res.json();
    if(data.image){
      lastReply = data.reply || 'Your image don ready!';
      box.innerHTML = lastReply + '<br><img src="'+data.image+'">';
      saveToGallery(data.image);
      speakText(lastReply);
    } else {
      lastReply = data.reply || data.music || data.error || 'No reply';
      box.innerText = lastReply;
      speakText(lastReply);
    }
  }catch(e){ box.innerText = 'Network error, try again. ' + e.message; }
}

function saveToGallery(url){
  let g = JSON.parse(localStorage.getItem('petruxGallery') || '[]');
  g.unshift(url);
  localStorage.setItem('petruxGallery', JSON.stringify(g));
}
function showGallery(){
  let g = JSON.parse(localStorage.getItem('petruxGallery') || '[]');
  let div = document.getElementById('gallery');
  if(g.length===0){ div.innerHTML = '<p>No image yet. Generate one first!</p>'; return; }
  div.innerHTML = '<h3>My Gallery</h3>' + g.map(u=>'<img src="'+u+'">').join('');
}
updateVoiceButton();
</script>
</body>
</html>
