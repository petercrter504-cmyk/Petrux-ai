<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petrux AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#1a0b2e;color:#fff;min-height:100vh;padding:15px}
.header{text-align:center;margin-bottom:15px}
.header h1{font-size:32px}
.header p{color:#c084fc;margin-top:5px}
.card{background:#2a1445;border-radius:20px;padding:15px;margin-bottom:15px}
textarea,input{width:100%;padding:12px;border-radius:12px;border:none;outline:none;font-size:16px;background:#fff;color:#000;margin-bottom:10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:10px 18px;border-radius:20px;border:1px solid #fff;background:transparent;color:#fff;cursor:pointer;font-size:15px}
.tab.active{background:#fff;color:#000;font-weight:bold}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:17px;font-weight:bold;cursor:pointer;margin-bottom:10px}
.btn-purple{background:#a855f7;color:#fff}
.btn-pink{background:#ec4899;color:#fff}
.btn-orange{background:#f59e0b;color:#000}
.btn-dark{background:#222;color:#fff}
.btn-green{background:#22c55e;color:#fff}
#replyBox{background:#000;border-radius:15px;padding:15px;min-height:120px;white-space:pre-wrap;line-height:1.6;font-size:16px;margin-top:10px}
#gallery img{width:100%;border-radius:12px;margin-bottom:10px}
small{color:#aaa}
</style>
</head>
<body>

<div class="header">
<h1>✨ Petrux AI</h1>
<p>Created by Peter Oriorowho</p>
</div>

<div class="card">
<div class="tabs">
<button class="tab active" id="tabAsk" onclick="setMode('ask')">💬 Ask</button>
<button class="tab" id="tabMusic" onclick="setMode('music')">🎵 Music</button>
<button class="tab" id="tabImage" onclick="setMode('image')">🖼️ Image</button>
<button class="tab" onclick="showGallery()">🖼️ My Gallery</button>
</div>

<textarea id="prompt" rows="3" placeholder="Ask Petrux anything... e.g. Give me best reply to this girl, Write a song about Lagos, Generate image of a superstar..."></textarea>

<button class="btn btn-purple" onclick="send()">Ask Petrux AI →</button>
<button class="btn btn-pink" onclick="talk()">🎙️ Talk to Petrux - Tap & Speak</button>

<!-- VOICE ON / OFF -->
<button id="voiceToggle" class="btn btn-dark" onclick="toggleVoice()">🔇 Voice: OFF - Tap to Turn ON</button>
<button class="btn btn-orange" onclick="hearSpeak()">🔊 Hear Petrux Speak</button>

<div id="replyBox">Ask me
