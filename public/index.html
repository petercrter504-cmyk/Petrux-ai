<script>
const $ = id => document.getElementById(id);

let history = [];
let busy = false;
let lastAnswer = '';

let chats = JSON.parse(
  localStorage.getItem('petrux_chats') || '[]'
);

let currentChat = Date.now().toString();
let isPro = false;

/* =========================================
   PRO STATUS
========================================= */

function updateProBadge(active) {
  isPro = Boolean(active);

  $('profileBadge').style.display =
    isPro ? 'inline-flex' : 'none';

  $('profileAvatar').classList.toggle('pro', isPro);

  $('profileStatus').textContent = isPro
    ? '💎 Petrux Pro Member'
    : 'Created by Peter Oriorowho';

  $('profileName').textContent = 'Petrux AI';
}

async function checkProStatus() {
  try {
    const token = localStorage.getItem(
      'petrux_pro_token'
    );

    const headers = {};

    if (token) {
      headers.Authorization = `Bearer ${token}`;
    }

    const response = await fetch(
      '/api/subscription/status',
      { headers }
    );

    if (!response.ok) {
      return;
    }

    const data = await response.json();

    updateProBadge(data.active === true);
  } catch (error) {
    console.log('Subscription status unavailable.');
  }
}

function openPro() {
  $('proModal').classList.add('show');
}

function closePro() {
  $('proModal').classList.remove('show');
}

async function subscribePro() {
  const email = prompt(
    'Enter your email address for Petrux Pro:'
  );

  if (!email) {
    return;
  }

  const button = document.querySelector(
    '.pro-subscribe'
  );

  button.disabled = true;

  $('proNote').textContent =
    'Preparing secure payment...';

  try {
    const response = await fetch(
      '/api/subscription/initialize',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || 'Could not start payment.'
      );
    }

    if (data.authorization_url) {
      window.location.href =
        data.authorization_url;
      return;
    }

    throw new Error(
      'Payment link was not received.'
    );
  } catch (error) {
    $('proNote').textContent =
      error.message || 'Payment could not be started.';

    button.disabled = false;
  }
}

/* =========================================
   NAVIGATION
========================================= */

function toggleSidebar(open) {
  $('sidebar').classList.toggle('open', open);
  $('backdrop').classList.toggle('show', open);
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(page => {
    page.classList.toggle(
      'active',
      page.id === id
    );
  });

  toggleSidebar(false);
}

function saveChats() {
  localStorage.setItem(
    'petrux_chats',
    JSON.stringify(chats.slice(-30))
  );

  renderChats();
}

function renderChats() {
  $('chatlist').innerHTML = '';

  chats.slice().reverse().forEach(chat => {
    const button = document.createElement('button');

    button.className =
      'chatitem' +
      (
        chat.id === currentChat
          ? ' active'
          : ''
      );

    button.textContent =
      chat.title || 'New chat';

    button.onclick = () =>
      loadChat(chat.id);

    $('chatlist').append(button);
  });
}

function newChat() {
  if (history.length) {
    chats = chats.filter(
      chat => chat.id !== currentChat
    );

    chats.push({
      id: currentChat,
      title:
        history.find(
          message => message.role === 'user'
        )?.content.slice(0, 36) ||
        'New chat',
      messages: history
    });
  }

  history = [];
  currentChat = Date.now().toString();

  $('messages').innerHTML = '';

  $('welcome').style.display = 'flex';

  $('chatStatus').textContent =
    'New conversation';

  saveChats();
  showPage('chat');
}

function loadChat(id) {
  const chat = chats.find(
    item => item.id === id
  );

  if (!chat) {
    return;
  }

  history = chat.messages || [];
  currentChat = id;

  $('messages').innerHTML = '';

  $('welcome').style.display =
    history.length ? 'none' : 'flex';

  history.forEach(message => {
    addMessage(
      message.role,
      message.content
    );
  });

  renderChats();
  showPage('chat');
}

/* =========================================
   CHAT
========================================= */

function addMessage(role, text) {
  $('welcome').style.display = 'none';

  const row = document.createElement('div');

  row.className =
    'message ' + role;

  const avatar =
    document.createElement('div');

  avatar.className = 'avatar';
  avatar.textContent = 'P';

  const bubble =
    document.createElement('div');

  bubble.className = 'bubble';
  bubble.textContent = text;

  if (role === 'assistant') {
    row.append(avatar, bubble);
  } else {
    row.append(bubble);
  }

  $('messages').append(row);

  $('chatarea').scrollTop =
    $('chatarea').scrollHeight;

  return bubble;
}

async function sendMessage() {
  const input = $('question');

  const text = input.value.trim();

  if (!text || busy) {
    return;
  }

  input.value = '';
  input.style.height = 'auto';

  history.push({
    role: 'user',
    content: text
  });

  addMessage('user', text);

  const bubble =
    addMessage('assistant', 'Thinking…');

  busy = true;

  $('sendBtn').disabled = true;

  $('chatStatus').textContent =
    'Petrux is thinking…';

  let answer = '';
  let completed = false;

  try {
    const response = await fetch(
      '/api/chat/stream',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          messages: history,
          research: $('research').checked
        })
      }
    );

    if (!response.ok) {
      let errorData = {};

      try {
        errorData =
          await response.json();
      } catch (error) {}

      throw new Error(
        errorData.error ||
        'Could not connect to Petrux AI.'
      );
    }

    if (!response.body) {
      throw new Error(
        'No response stream received.'
      );
    }

    const reader =
      response.body.getReader();

    const decoder =
      new TextDecoder();

    let buffer = '';

    while (true) {
      const result =
        await reader.read();

      if (result.done) {
        break;
      }

      buffer += decoder.decode(
        result.value,
        { stream: true }
      );

      const frames =
        buffer.split('\n\n');

      buffer = frames.pop() || '';

      for (const frame of frames) {
        const line =
          frame
            .split('\n')
            .find(item =>
              item.startsWith('data: ')
            );

        if (!line) {
          continue;
        }

        let event;

        try {
          event = JSON.parse(
            line.slice(6)
          );
        } catch (error) {
          continue;
        }

        /*
         * This matches your server.js:
         *
         * data: {"token":"Hello"}
         * data: {"done":true}
         */

        if (
          typeof event.token === 'string'
        ) {
          if (!answer) {
            bubble.textContent = '';
          }

          answer += event.token;

          bubble.textContent = answer;

          $('chatarea').scrollTop =
            $('chatarea').scrollHeight;
        }

        if (event.done === true) {
          completed = true;
        }

        if (event.error) {
          throw new Error(event.error);
        }
      }
    }

    if (!completed && !answer) {
      throw new Error(
        'Connection ended before receiving an answer.'
      );
    }

    if (!answer) {
      answer =
        'Sorry, Petrux AI did not return a response.';
    }

    bubble.textContent = answer;

    history.push({
      role: 'assistant',
      content: answer
    });

    lastAnswer = answer;

    $('chatStatus').textContent =
      'Ready';

    chats = chats.filter(
      chat => chat.id !== currentChat
    );

    chats.push({
      id: currentChat,
      title:
        history.find(
          message => message.role === 'user'
        )?.content.slice(0, 36) ||
        'New chat',
      messages: history
    });

    saveChats();

  } catch (error) {
    console.error(
      'Chat error:',
      error
    );

    bubble.textContent = answer
      ? answer +
        '\n\n[Connection issue: ' +
        error.message +
        ']'
      : 'Sorry, I could not get a reply. ' +
        error.message;

    $('chatStatus').textContent =
      'Connection error';
  } finally {
    busy = false;

    $('sendBtn').disabled = false;

    input.focus();
  }
}

/* =========================================
   IMAGE GENERATION
========================================= */

async function createImage() {
  const prompt =
    $('imagePrompt').value.trim();

  if (!prompt) {
    alert(
      'Please describe the image you want.'
    );
    return;
  }

  if (!isPro) {
    openPro();
    return;
  }

  const button = $('imageBtn');
  const result = $('imageResult');

  button.disabled = true;
  button.textContent = 'Generating…';

  result.style.display = 'block';
  result.textContent =
    'Creating your image…';

  try {
    const token = localStorage.getItem(
      'petrux_pro_token'
    );

    const response = await fetch(
      '/api/images',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization:
            `Bearer ${token || ''}`
        },
        body: JSON.stringify({ prompt })
      }
    );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        'Image generation failed.'
      );
    }

    result.textContent =
      data.message ||
      'Image generated successfully.';
  } catch (error) {
    result.textContent =
      error.message;
  } finally {
    button.disabled = false;
    button.textContent =
      'Generate image';
  }
}

/* =========================================
   SONG LAB
========================================= */

async function writeSong() {
  const idea =
    $('songIdea').value.trim();

  const genre =
    $('genre').value;

  const mood =
    $('mood').value;

  if (!idea) {
    alert(
      'Please enter a song idea.'
    );
    return;
  }

  const button = $('songBtn');
  const result = $('songResult');

  button.disabled = true;
  button.textContent =
    'Writing…';

  result.style.display = 'block';
  result.textContent =
    'Petrux is writing your song…';

  try {
    const response = await fetch(
      '/api/song',
      {
        method: 'POST',
        headers: {
          'Content-Type':
            'application/json'
        },
        body: JSON.stringify({
          prompt:
            `Genre: ${genre}\n` +
            `Mood: ${mood}\n` +
            `Idea: ${idea}`
        })
      }
    );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        'Song generation failed.'
      );
    }

    result.textContent =
      data.lyrics ||
      'No lyrics were returned.';
  } catch (error) {
    result.textContent =
      'Error: ' + error.message;
  } finally {
    button.disabled = false;
    button.textContent =
      'Write lyrics';
  }
}

async function makeTrack() {
  if (!isPro) {
    openPro();
    return;
  }

  const prompt =
    $('musicPrompt').value.trim();

  if (!prompt) {
    alert(
      'Please describe the song you want.'
    );
    return;
  }

  const button = $('trackBtn');
  const result = $('trackResult');

  button.disabled = true;
  button.textContent =
    'Generating…';

  result.style.display = 'block';
  result.textContent =
    'Preparing your full song…';

  try {
    const token = localStorage.getItem(
      'petrux_pro_token'
    );

    const response = await fetch(
      '/api/song-audio',
      {
        method: 'POST',
        headers: {
          'Content-Type':
            'application/json',
          Authorization:
            `Bearer ${token || ''}`
        },
        body: JSON.stringify({ prompt })
      }
    );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        'Song generation failed.'
      );
    }

    result.textContent =
      data.message ||
      'Your song is ready.';
  } catch (error) {
    result.textContent =
      error.message;
  } finally {
    button.disabled = false;
    button.textContent =
      'Generate full song';
  }
}

/* =========================================
   VOICE
========================================= */

async function askVoice() {
  const input =
    $('voiceInput').value.trim();

  if (!input) {
    alert(
      'Please enter a message first.'
    );
    return;
  }

  const result =
    $('voiceResult');

  result.textContent =
    'Petrux is thinking…';

  try {
    const response = await fetch(
      '/api/chat',
      {
        method: 'POST',
        headers: {
          'Content-Type':
            'application/json'
        },
        body: JSON.stringify({
          message: input
        })
      }
    );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        'Could not get a response.'
      );
    }

    lastAnswer = data.answer || '';

    result.textContent =
      lastAnswer || 'No answer received.';
  } catch (error) {
    result.textContent =
      'Error: ' + error.message;
  }
}

function startDictation() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    alert(
      'Voice dictation is not supported by this browser.'
    );
    return;
  }

  const recognition =
    new Recognition();

  recognition.lang = 'en-US';

  recognition.onresult =
    function (event) {
      $('voiceInput').value =
        event.results[0][0].transcript;
    };

  recognition.onerror =
    function () {
      alert(
        'Voice recognition could not start.'
      );
    };

  recognition.start();
}

function speakLast() {
  if (!lastAnswer) {
    alert(
      'There is no answer to read yet.'
    );
    return;
  }

  if (!('speechSynthesis' in window)) {
    alert(
      'Text-to-speech is not supported by this browser.'
    );
    return;
  }

  speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(
      lastAnswer
    );

  speech.rate = 1;
  speechSynthesis.speak(speech);
}

/* =========================================
   KEYBOARD AND AUTO RESIZE
========================================= */

$('question').addEventListener(
  'input',
  function () {
    this.style.height = 'auto';

    this.style.height =
      Math.min(
        this.scrollHeight,
        180
      ) + 'px';
  }
);

$('question').addEventListener(
  'keydown',
  function (event) {
    if (
      event.key === 'Enter' &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }
  }
);

/* =========================================
   SERVER STATUS
========================================= */

async function checkStatus() {
  try {
    const response = await fetch(
      '/api/status'
    );

    if (!response.ok) {
      throw new Error();
    }

    await response.json();

    $('dot').classList.add('on');

    $('statusText').textContent =
      'Online';
  } catch (error) {
    $('dot').classList.remove('on');

    $('statusText').textContent =
      'Offline';
  }
}

/* =========================================
   START APP
========================================= */

renderChats();
checkStatus();
checkProStatus();

setInterval(
  checkStatus,
  30000
);
</script>
